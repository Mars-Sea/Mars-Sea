<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Mars-Sea — Backend Engineer, Go / Java / Distributed Systems, AI Applications">
  <title>Mars-Sea</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="55%" stop-color="#0F2027"/>
      <stop offset="100%" stop-color="#12303F"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2E9EF7"/>
      <stop offset="100%" stop-color="#41E0C0"/>
    </linearGradient>

    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2E9EF7" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#2E9EF7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#41E0C0" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#41E0C0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <circle cx="1060" cy="10" r="280" fill="url(#glowA)"/>
  <circle cx="110" cy="290" r="240" fill="url(#glowB)"/>

  <!-- technical grid -->
  <g stroke="#7DD3FC" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200"/>
    <path d="M120 0V300M300 0V300M480 0V300M660 0V300M840 0V300M1020 0V300"/>
  </g>

  <!-- terminal window -->
  <rect x="80" y="42" width="1040" height="230" rx="18" fill="#0A1018" fill-opacity="0.62" stroke="#7DD3FC" stroke-opacity="0.16"/>
  <path d="M80 60a18 18 0 0 1 18-18h1004a18 18 0 0 1 18 18v3H80z" fill="url(#accent)" fill-opacity="0.9"/>

  <circle cx="112" cy="79" r="5.5" fill="#FF5F57"/>
  <circle cx="132" cy="79" r="5.5" fill="#FEBC2E"/>
  <circle cx="152" cy="79" r="5.5" fill="#28C840"/>

  <text x="180" y="84" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" fill="#7DD3FC" fill-opacity="0.60">mars-sea@github ~ % whoami</text>

  <!-- name -->
  <text x="180" y="188" font-family="'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="70" font-weight="700" letter-spacing="1" fill="#F8FAFC">Mars-Sea</text>

  <!-- roles -->
  <text x="180" y="234" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="21" fill="#9FE8DA">Backend Engineer</text>
  <text x="404" y="234" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="21" fill="#7DD3FC" fill-opacity="0.40">/</text>
  <text x="440" y="234" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="21" fill="#9FE8DA">Go</text>
  <text x="495" y="234" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="21" fill="#7DD3FC" fill-opacity="0.40">·</text>
  <text x="530" y="234" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="21" fill="#9FE8DA">Java</text>
  <text x="610" y="234" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="21" fill="#7DD3FC" fill-opacity="0.40">/</text>
  <text x="646" y="234" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="21" fill="#9FE8DA">Distributed Systems</text>
  <text x="910" y="234" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="21" fill="#7DD3FC" fill-opacity="0.40">/</text>
  <text x="946" y="234" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="21" fill="#9FE8DA">AI Apps</text>

  <rect x="1080" y="219" width="11" height="21" fill="#41E0C0">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <rect x="0" y="293" width="1200" height="7" fill="url(#accent)"/>
</svg>
